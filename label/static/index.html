<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grant labelling</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#EFEBE4;color:#1A1A1C;font:15px/1.55 "Instrument Sans",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.app{height:100vh;display:flex;flex-direction:column;background:#FBFAF8}
.ticks{flex:none;display:flex;gap:1px;align-items:flex-end;height:8px;padding:0 2px;background:#F4F1EC}
.ticks button{flex:1;border:0;padding:0;cursor:pointer;border-radius:2px;height:4px}
.bar{flex:none;display:flex;align-items:center;gap:16px;padding:0 30px;height:58px;border-bottom:1px solid #EFEBE4}
.bar .sp{flex:1}
.pos{font-size:14px;color:#57575C;font-variant-numeric:tabular-nums}
.pos b{color:#1A1A1C;font-weight:600}
.ghost{background:none;border:1px solid #DFDAD2;border-radius:8px;color:#1A1A1C;padding:7px 13px;cursor:pointer;font-size:13.5px}
.ghost:hover{border-color:#14375F;background:#F4F6FA}
.main{flex:1;min-height:0;display:flex}
.col{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
/* align-items:flex-start matters: as a stretched flex item .doc would take
   the scroll pane's height instead of its content's, and a long abstract
   would overflow invisibly rather than scrolling. */
.scroll{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:40px 30px 8px}
.doc{width:100%;max-width:716px}
.meta{font-size:13.5px;color:#70707A;margin-bottom:18px}
h2.title{margin:0 0 22px;font:600 32px/1.24 "Instrument Sans",sans-serif;letter-spacing:-.022em;color:#111113;max-width:28ch;text-wrap:pretty}
p.abs{margin:0;font:400 18px/1.72 "Source Serif 4",Georgia,serif;color:#34343A;max-width:64ch;text-wrap:pretty;white-space:pre-wrap}
.answers{flex:none;padding:0 30px 18px}
.answers .inner{max-width:716px;margin:0 auto}
.qrow{display:flex;align-items:baseline;gap:12px;padding-top:13px;border-top:1px solid #EFEBE4;margin-bottom:11px;flex-wrap:wrap}
.q{font-size:15px;font-weight:600;color:#111113;letter-spacing:-.01em}
.qhint{font-size:13.5px;color:#70707A}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{position:relative;display:flex;align-items:center;gap:15px;text-align:left;width:100%;background:#fff;border:1px solid #DFDAD2;border-radius:10px;padding:9px 15px;cursor:pointer;color:#1A1A1C}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:#F4F1EC;color:#57575C;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font:500 16px/1.25 "Instrument Sans",sans-serif;letter-spacing:-.01em}
.opt .t span{display:block;font-size:13.5px;line-height:1.35;color:#70707A;margin-top:1px}
.opt .mine{flex:none;position:relative;font-size:13px;font-weight:500}
.opt .ring{position:absolute;inset:-1px;border-radius:10px;pointer-events:none;border:1.5px solid transparent}
.opt[data-on="1"][data-a="yes"] .ring{border-color:#1B5E8C;background:rgba(27,94,140,.055)}
.opt[data-on="1"][data-a="no"] .ring{border-color:#8A8A8F;background:rgba(138,138,143,.07)}
.opt[data-on="1"][data-a="borderline"] .ring{border-color:#8B5A9E;background:rgba(139,90,158,.06)}
.opt[data-a="yes"]:hover{border-color:#1B5E8C;background:#F5F9FC}
.opt[data-a="no"]:hover{border-color:#8A8A8F;background:#F7F6F4}
.opt[data-a="borderline"]:hover{border-color:#8B5A9E;background:#F9F6FA}
.flags{display:flex;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid #EFEBE4}
.tick{position:relative;flex:1;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:1px solid #DFDAD2;border-radius:10px;padding:8px 14px;cursor:pointer;color:#1A1A1C}
.tick.dash{border-style:dashed;border-color:#D3CDC3}
.tick .box{flex:none;width:21px;height:21px;border-radius:6px;border:1.5px solid #B9B3A8;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.tick .t{flex:1;min-width:0}
.tick .t b{display:block;font:500 14.5px/1.3 "Instrument Sans",sans-serif}
.tick .t span{display:block;font-size:12.5px;line-height:1.3;color:#70707A;margin-top:1px}
.tick .kk{flex:none;font-size:13px;font-weight:600;color:#70707A}
.tick[data-on="1"]{border-color:#2F7A4F;background:rgba(47,122,79,.05)}
.tick[data-on="1"] .box{border-color:#2F7A4F;color:#2F7A4F}
.tick.dash[data-on="1"]{border-color:#B4472F;background:rgba(180,71,47,.045)}
.tick.dash[data-on="1"] .box{border-color:#B4472F;color:#B4472F}
.tick:hover{border-color:#2F7A4F;background:#F5FAF6}
.tick.dash:hover{border-color:#B4472F;background:#FDF7F5}
.foot{display:flex;align-items:center;gap:16px;margin-top:11px}
.foot .hint{font-size:12.5px;color:#70707A}
.small{background:none;border:1px solid #DFDAD2;border-radius:8px;color:#57575C;padding:6px 12px;cursor:pointer;font-size:13px}
.small:hover{border-color:#14375F;color:#14375F}
/* z-index because the answer buttons are position:relative and would
   otherwise show through this sheet. */
.note{position:absolute;left:0;right:0;bottom:0;z-index:3;background:#fff;border-top:1px solid #DFDAD2;padding:18px 30px 20px;box-shadow:0 -14px 30px -20px rgba(40,34,24,.25);animation:fadein .14s ease}
.note input{width:100%;background:#FBFAF8;border:1px solid #D3CDC3;border-radius:9px;padding:12px 14px;color:#1A1A1C;font:400 16px/1.4 "Source Serif 4",Georgia,serif;outline:none}
.note input:focus{border-color:#14375F;background:#fff}
.ref{flex:none;width:420px;background:#fff;border-left:1px solid #E7E3DD;overflow-y:auto;padding:26px 28px 34px;animation:fadein .16s ease}
.ref h3{margin:0;font:600 20px/1.2 "Instrument Sans",sans-serif;letter-spacing:-.02em}
.card{background:#F7F9FC;border-radius:10px;padding:16px 18px;margin-bottom:22px}
.card p{margin:0 0 12px;font:400 15px/1.62 "Source Serif 4",Georgia,serif;color:#34343A}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13.5px;color:#57575C;align-items:center}
.centre{max-width:900px;margin:0 auto;padding:56px 32px}
.big{background:#14375F;border:0;border-radius:9px;color:#fff;font-size:15px;font-weight:500;padding:14px 28px;cursor:pointer}
.done h1{margin:0 0 16px;font:600 38px/1.16 "Instrument Sans",sans-serif;letter-spacing:-.03em;color:#111113;max-width:26ch}
.tally{display:flex;flex-direction:column;gap:20px;max-width:520px}
.tally .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.tally .track{height:5px;border-radius:3px;background:#EFEBE4}
.tally .fill{display:block;height:5px;border-radius:3px}
.err{background:#FDF7F5;border:1px solid #E8C4B8;border-radius:10px;padding:16px 18px;color:#7A2E1B;max-width:640px}
/* Short viewports: the abstract is the thing being judged, so the control
   panel gives up its secondary hints before the reading pane gives up
   height. */
@media (max-height:820px){
  .scroll{padding:24px 30px 6px}
  h2.title{font-size:26px;margin-bottom:14px}
  p.abs{font-size:17px;line-height:1.66}
  .qrow .qhint:last-of-type{display:none}
  .opt .t span{display:none}
  .opt{padding:10px 15px}
  .tick .t span{display:none}
  .foot .hint{font-size:12px}
}
@media (max-width:820px){
  .ref{position:fixed;inset:0;width:auto;z-index:5}
  .scroll{padding:18px 18px 8px}
  h2.title{font-size:23px;margin-bottom:14px}
  p.abs{font-size:17.5px;line-height:1.7}
  .answers{padding:0 16px 16px}
  .opts{gap:6px}
  .opt{padding:10px 13px;min-height:52px}
  .flags{flex-direction:column;gap:6px}
  .bar{padding:0 16px;gap:10px}
  .bar .who{display:none}
  .foot .hint{display:none}
}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
const QS = new URLSearchParams(location.search);
const BATCH = QS.get("batch") || "batch_001";
const WHO = (QS.get("who") || "").toLowerCase();
const ANSWERS = ["yes", "no", "borderline"];
const COL = { yes: "#1B5E8C", no: "#8A8A8F", borderline: "#8B5A9E" };
const LABEL = { yes: "Yes", no: "No", borderline: "Borderline" };
const HINT = {
  yes: "Ageing itself is what is studied or targeted",
  no: "Age may be the context; ageing is not the subject",
  borderline: "The text is clear; the grant reads both ways"
};

let S = { records: [], mine: {}, i: 0, parked: {}, ref: false, asking: false, askWhy: "", note: "", started: false, done: false, error: "" };
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = v => v == null ? "" : "€" + Math.round(v).toLocaleString("en-GB");
const cur = () => S.records[S.i] || null;
const mineFor = id => S.mine[id] || null;

async function boot() {
  if (!WHO) { S.error = "This link is missing your name. It should end with <b>&amp;who=your-name</b> — ask whoever sent it for your personal link."; return render(); }
  try {
    const res = await fetch(`/api/records?batch=${encodeURIComponent(BATCH)}&who=${encodeURIComponent(WHO)}`);
    const data = await res.json();
    if (data.error) { S.error = esc(data.error); return render(); }
    S.records = data.records;
    S.mine = data.mine || {};
    const firstUnlabelled = S.records.findIndex(r => !S.mine[r.record_id]);
    S.i = firstUnlabelled === -1 ? 0 : firstUnlabelled;
    S.started = Object.keys(S.mine).length > 0;
    S.done = firstUnlabelled === -1 && S.records.length > 0;
  } catch (e) { S.error = "Could not reach the server. Is it still running?"; }
  render();
}

function answered(id) { const m = mineFor(id); return m && (m.geroscience || m.cant_tell); }

function advance() {
  let n = S.i + 1;
  while (n < S.records.length && S.parked[S.records[n].record_id]) n++;
  if (n >= S.records.length) {
    const parked = S.records.findIndex(r => S.parked[r.record_id] && !answered(r.record_id));
    if (parked !== -1) { S.i = parked; S.parked[S.records[parked].record_id] = false; }
    else if (S.records.every(r => answered(r.record_id))) { S.done = true; }
    else { S.i = S.records.findIndex(r => !answered(r.record_id)); }
  } else S.i = n;
  S.asking = false; S.note = "";
  render();
}

async function save(patch) {
  const r = cur(); if (!r) return;
  const prev = mineFor(r.record_id) || {};
  const body = {
    batch: BATCH, labeller_id: WHO, record_id: r.record_id,
    geroscience: patch.geroscience !== undefined ? patch.geroscience : (prev.geroscience || null),
    cancer: patch.cancer !== undefined ? patch.cancer : !!prev.cancer,
    cant_tell: patch.cant_tell !== undefined ? patch.cant_tell : !!prev.cant_tell,
    reason: patch.reason !== undefined ? patch.reason : (prev.reason || "")
  };
  S.mine[r.record_id] = Object.assign({}, prev, body);
  render();
  try {
    const res = await fetch("/api/judgment", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.error) { S.error = esc(data.error); render(); }
  } catch (e) { S.error = "Your last answer did not save — check the connection."; render(); }
}

function pick(a) {
  const r = cur(); if (!r) return;
  save({ geroscience: a });
  if (a === "borderline") { S.asking = true; S.askWhy = "which way does it lean, and what stopped you?"; S.note = (mineFor(r.record_id) || {}).reason || ""; render(); focusNote(); }
  else advance();
}
function toggleCancer() { const r = cur(); if (r) save({ cancer: !(mineFor(r.record_id) || {}).cancer }); }
function toggleFlag() {
  const r = cur(); if (!r) return;
  const on = !(mineFor(r.record_id) || {}).cant_tell;
  save({ cant_tell: on });
  if (on) { S.asking = true; S.askWhy = "what was missing from the text?"; S.note = (mineFor(r.record_id) || {}).reason || ""; render(); focusNote(); }
}
function park() { const r = cur(); if (!r) return; S.parked[r.record_id] = true; advance(); }
function openNote() { const r = cur(); if (!r) return; S.asking = true; S.askWhy = "anything a second reader would need"; S.note = (mineFor(r.record_id) || {}).reason || ""; render(); focusNote(); }
function focusNote() {
  const el = document.getElementById("noteinput");
  if (!el) return;
  el.focus();
  el.selectionStart = el.selectionEnd = el.value.length;
  // Bound here rather than as an inline attribute so the commit path does
  // not depend on attribute-scope resolution, and so the value is read off
  // the element itself at save time instead of mirrored into state on every
  // keystroke.
  el.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); closeNote(false); }
    else if (e.key === "Escape") { e.preventDefault(); closeNote(true); }
  };
}
function noteValue() {
  const el = document.getElementById("noteinput");
  return el ? el.value : S.note;
}
function closeNote(discard) {
  const r = cur();
  const text = noteValue();
  S.note = "";
  S.asking = false;
  // save() updates local state synchronously before its request, so the
  // answered() check below sees the reason that was just written.
  if (!discard && r) save({ reason: text });
  if (r && answered(r.record_id)) advance(); else render();
}
function move(d) { S.i = Math.max(0, Math.min(S.records.length - 1, S.i + d)); S.asking = false; render(); }

document.addEventListener("keydown", e => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (S.error || !S.records.length || S.done) return;
  if (!S.started) { if (e.key === "Enter") { e.preventDefault(); S.started = true; render(); } return; }
  const k = e.key;
  if (k === "1") { e.preventDefault(); pick("yes"); }
  else if (k === "2") { e.preventDefault(); pick("no"); }
  else if (k === "3") { e.preventDefault(); pick("borderline"); }
  else if (k === "4") { e.preventDefault(); toggleCancer(); }
  else if (k === "c" || k === "C") { e.preventDefault(); toggleFlag(); }
  else if (k === "s" || k === "S") { e.preventDefault(); park(); }
  else if (k === "r" || k === "R") { e.preventDefault(); openNote(); }
  else if (k === "?" || k === "/") { e.preventDefault(); S.ref = !S.ref; render(); }
  else if (k === "ArrowLeft") { e.preventDefault(); move(-1); }
  else if (k === "ArrowRight") { e.preventDefault(); move(1); }
});

function tickStrip() {
  return `<div class="ticks">` + S.records.map((r, n) => {
    const m = S.mine[r.record_id];
    const isCur = n === S.i;
    let bg = "#E7E3DD";
    if (S.parked[r.record_id] && !answered(r.record_id)) bg = "repeating-linear-gradient(45deg,#D6D1C9 0 2px,#F0EDE8 2px 4px)";
    else if (m && m.geroscience) bg = COL[m.geroscience];
    const style = `height:${isCur ? 8 : 4}px;background:${isCur ? "#14375F" : bg};${m && m.cant_tell ? "box-shadow:inset 0 -2px 0 #B4472F;" : ""}`;
    const state = m && m.geroscience ? LABEL[m.geroscience].toLowerCase() : (S.parked[r.record_id] ? "parked" : "not yet seen");
    return `<button style="${style}" title="Record ${n + 1} — ${state}" onclick="S.i=${n};S.asking=false;render()"></button>`;
  }).join("") + `</div>`;
}

function refPanel() {
  if (!S.ref) return "";
  return `<div class="ref">
    <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px">
      <h3>Definitions</h3>
      <button class="small" style="border:0" onclick="S.ref=false;render()">Close <b>?</b></button>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;color:#14375F;margin-bottom:8px">Geroscience</div>
      <p>Research into the causes of ageing, and attempts to intervene in it or develop treatments. Most grants name no disease and no treatment — ask only: <b style="font-weight:600;color:#111113">is ageing the thing being studied?</b></p>
      <div style="display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:#34343A;line-height:1.5">
        <div><b style="color:#1B5E8C">Yes</b> &nbsp;"how stem cells lose function with age"</div>
        <div><b style="color:#1B5E8C">Yes</b> &nbsp;comparative biology of lifespan across species</div>
        <div><b style="color:#57575C">No</b> &nbsp;"how does this ion channel gate", in old mice</div>
        <div><b style="color:#57575C">No</b> &nbsp;senescence in plants, batteries, fetal membranes</div>
      </div>
    </div>
    <div style="margin-bottom:22px">
      <div style="font-size:14px;font-weight:600;color:#2F7A4F;margin-bottom:8px">Cancer, the comparator</div>
      <p style="margin:0 0 10px;font:400 15px/1.62 'Source Serif 4',Georgia,serif;color:#34343A">A separate tick, not a rival category. It exists so ageing funding can be read against a field of known size.</p>
      <p style="margin:0;font-size:13.5px;line-height:1.55;color:#57575C">Tick it whenever cancer is a subject of the grant — a senolytic tested on tumours is both. Patient age is irrelevant to it.</p>
    </div>
    <div style="margin-bottom:24px">
      <div style="font-size:14px;font-weight:600;margin-bottom:12px">Borderline is not "couldn't tell"</div>
      <div class="grid2">
        <div style="border-top:2px solid #8B5A9E;padding-top:10px">
          <div style="font-size:13.5px;font-weight:600;color:#8B5A9E;margin-bottom:5px">Borderline</div>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#34343A">The text told you plenty. The <i>grant</i> reads both ways.</p>
          <p style="margin:7px 0 0;font-size:13px;line-height:1.5;color:#70707A">"Targeting ageing to prevent Alzheimer's."</p>
        </div>
        <div style="border-top:2px dashed #B4472F;padding-top:10px">
          <div style="font-size:13.5px;font-weight:600;color:#B4472F;margin-bottom:5px">Couldn't tell</div>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#34343A">The <i>text</i> failed. Independent of your answer.</p>
          <p style="margin:7px 0 0;font-size:13px;line-height:1.5;color:#70707A">A two-line stub, or a quote cut mid-sentence.</p>
        </div>
      </div>
      <p style="margin:13px 0 0;font-size:13px;line-height:1.55;color:#57575C">It finds bad source text, not bad labellers — flag it <i>and</i> give your best guess.</p>
    </div>
    <div style="font-size:14px;font-weight:600;margin-bottom:14px">Keys</div>
    <div class="keys">
      <b style="color:#1A1A1C">1 2 3</b><span>yes · no · borderline</span>
      <b style="color:#1A1A1C">4</b><span>cancer, on or off</span>
      <b style="color:#1A1A1C">C</b><span>flag the text</span>
      <b style="color:#1A1A1C">S</b><span>park for later</span>
      <b style="color:#1A1A1C">R</b><span>add a reason</span>
      <b style="color:#1A1A1C">← →</b><span>any record, back or forward</span>
    </div>
    <p style="margin:16px 0 0;font-size:13px;color:#70707A">No machine prediction appears anywhere in this tool.</p>
  </div>`;
}

function intro() {
  return `<div class="app"><div style="flex:1;overflow-y:auto"><div class="centre">
    <div style="font-size:14px;font-weight:500;color:#14375F;margin-bottom:10px">Before you start · one minute</div>
    <h1 style="margin:0 0 12px;font:600 36px/1.14 'Instrument Sans',sans-serif;letter-spacing:-.03em;max-width:26ch">Two questions per grant.</h1>
    <p style="margin:0 0 26px;font:400 18px/1.6 'Source Serif 4',Georgia,serif;color:#34343A;max-width:78ch">${S.records.length} real grants — title, abstract, funder, amount, year. No machine predictions: your read has to be independent of ours. Saved as you go.</p>
    <div style="border-top:1px solid #E7E3DD;padding-top:24px;max-width:70ch">
      <div style="font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px">Is this geroscience?</div>
      <p style="margin:0 0 18px;font:400 16px/1.6 'Source Serif 4',Georgia,serif;color:#57575C">Research into the causes of ageing, and attempts to intervene in it or develop treatments.</p>
      ${ANSWERS.map((a, n) => `<div style="display:flex;gap:16px;margin-bottom:14px">
        <span style="flex:none;width:30px;height:30px;border-radius:8px;background:${COL[a]};color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center">${n + 1}</span>
        <div><div style="font-size:17px;font-weight:600;margin-bottom:4px">${LABEL[a]}</div>
        <p style="margin:0;font:400 15.5px/1.6 'Source Serif 4',Georgia,serif;color:#57575C;max-width:62ch">${
          a === "yes" ? "Ageing biology, lifespan and healthspan, geroprotectors, comparative biology of long-lived species — and interventions aimed at the process that merely use a disease to prove it."
          : a === "no" ? "Ageing is not the subject. Disease work with no ageing framing is No, and so is the \"ageing\" of plants or materials."
          : "It reads both ways once you have applied the rule above. Expect a handful."
        }</p></div></div>`).join("")}
      <div style="padding-top:18px;border-top:1px solid #E7E3DD;margin-top:22px">
        <div style="font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px">Is this cancer research? <b style="font-size:13px;background:#F0EDE8;padding:5px 9px;border-radius:6px">4</b></div>
        <p style="margin:0;font:400 16.5px/1.64 'Source Serif 4',Georgia,serif;color:#57575C;max-width:64ch">An independent tick, not a rival category: cancer is the field we read ageing funding against. Tick it whenever cancer is a subject of the grant, whatever you answered above.</p>
      </div>
      <div class="card" style="margin-top:26px">
        <div style="font-size:15px;font-weight:600;color:#14375F;margin-bottom:10px">The case that comes up most</div>
        <p>Most grants are pure mechanism: how a cell, tissue or pathway works. No disease, no treatment. That is the largest slice of the money, and it is not Borderline. One question decides it: <b style="font-weight:600;color:#111113">is ageing the thing being studied?</b></p>
        <div class="grid2" style="border-top:1px solid #DDE4EE;padding-top:16px">
          <div><div style="font-size:13.5px;font-weight:600;color:#1B5E8C;margin-bottom:6px">Yes</div><div style="font-size:14px;line-height:1.5;color:#34343A">"Do megakaryocytes preserve their function during ageing?"<br><span style="color:#70707A">Ageing is the subject. No disease needed.</span></div></div>
          <div><div style="font-size:13.5px;font-weight:600;color:#57575C;margin-bottom:6px">No</div><div style="font-size:14px;line-height:1.5;color:#34343A">"How do trees know it is autumn?"<br><span style="color:#70707A">Leaf senescence. Real biology, other sense.</span></div></div>
        </div>
      </div>
    </div>
  </div></div>
  <div style="flex:none;border-top:1px solid #E7E3DD;background:#fff;padding:18px 32px;display:flex;align-items:center;gap:24px;flex-wrap:wrap">
    <button class="big" onclick="S.started=true;render()">Start labelling &nbsp;↵</button>
    <span style="font-size:14px;color:#57575C"><b>1 2 3</b> answer · <b>4</b> cancer · <b>C</b> couldn't tell · <b>S</b> park · <b>R</b> reason · <b>?</b> definitions</span>
  </div></div>`;
}

function finished() {
  const vals = Object.values(S.mine);
  const c = a => vals.filter(v => v.geroscience === a).length;
  const n = Math.max(1, vals.length);
  const rows = ANSWERS.map(a => ({ k: LABEL[a], v: c(a), col: COL[a] }))
    .concat([{ k: "Ticked cancer research", v: vals.filter(v => v.cancer).length, col: "#2F7A4F" },
             { k: "Flagged “couldn't tell”", v: vals.filter(v => v.cant_tell).length, col: "#B4472F" }]);
  return `<div class="app"><div style="flex:1;overflow-y:auto"><div class="centre done">
    <div style="font-size:14px;font-weight:500;color:#2F7A4F;margin-bottom:16px">Batch complete</div>
    <h1>That is all ${S.records.length}. Your labels are recorded.</h1>
    <p style="margin:0 0 42px;font:400 18px/1.66 'Source Serif 4',Georgia,serif;color:#34343A;max-width:68ch">Nothing further is needed. Below is what you said, for your own reference — not a score.</p>
    <div class="tally">${rows.map(r => `<div>
      <div class="row"><span style="font-size:15px">${r.k}</span><span style="font-size:17px;font-weight:600;color:${r.col};font-variant-numeric:tabular-nums">${r.v}</span></div>
      <div class="track"><i class="fill" style="width:${Math.round(r.v / n * 100)}%;background:${r.col}"></i></div></div>`).join("")}
    </div>
    <p style="margin:34px 0 0;font-size:14.5px;color:#57575C;max-width:60ch">Every record stays open — step back with <b>←</b> if something has been nagging at you.</p>
    <button class="ghost" style="margin-top:14px" onclick="S.done=false;S.i=0;render()">Review all ${S.records.length} answers</button>
  </div></div></div>`;
}

function render() {
  if (S.error) { app.innerHTML = `<div class="centre"><div class="err">${S.error}</div></div>`; return; }
  if (!S.records.length) { app.innerHTML = `<div class="centre" style="color:#70707A">Loading…</div>`; return; }
  if (!S.started) { app.innerHTML = intro(); return; }
  if (S.done) { app.innerHTML = finished(); return; }

  const r = cur(); const m = mineFor(r.record_id) || {};
  app.innerHTML = `
  ${tickStrip()}
  <div class="bar">
    <span style="font-size:14px;font-weight:500">Grant labelling</span>
    <span class="who" style="font-size:13.5px;color:#70707A">${esc(BATCH)} · blind pass · ${esc(WHO)}</span>
    <div class="sp"></div>
    <span class="pos"><b>${S.i + 1}</b> of ${S.records.length}</span>
    <button class="ghost" onclick="S.ref=!S.ref;render()">Definitions <b style="color:#70707A">?</b></button>
  </div>
  <div class="main">
    <div class="col">
      <div class="scroll"><div class="doc">
        <div class="meta">${esc(r.funder)}${r.year ? " · " + esc(r.year) : ""}${r.amount_eur ? " · " + money(r.amount_eur) : ""}</div>
        <h2 class="title">${esc(r.title)}</h2>
        <p class="abs">${esc(r.abstract)}</p>
        <div style="height:24px"></div>
      </div></div>
      <div class="answers"><div class="inner">
        <div class="qrow">
          <span class="q">Is this geroscience?</span>
          <span class="qhint">causes of ageing, or intervening in it</span>
          <div class="sp"></div>
          <span class="qhint">mechanism with no disease named still counts</span>
        </div>
        <div class="opts">
          ${ANSWERS.map((a, n) => `<button class="opt" data-a="${a}" data-on="${m.geroscience === a ? 1 : 0}" onclick="pick('${a}')">
            <span class="k">${n + 1}</span>
            <span class="t"><b>${LABEL[a]}</b><span>${HINT[a]}</span></span>
            ${m.geroscience === a ? `<span class="mine" style="color:${COL[a]}">Your answer</span>` : ""}
            <span class="ring"></span>
          </button>`).join("")}
        </div>
        <div class="flags">
          <button class="tick" data-on="${m.cancer ? 1 : 0}" onclick="toggleCancer()">
            <span class="box">${m.cancer ? "✓" : ""}</span>
            <span class="t"><b>Cancer research</b><span>The comparator — independent of your answer</span></span>
            <span class="kk">4</span>
          </button>
          <button class="tick dash" data-on="${m.cant_tell ? 1 : 0}" onclick="toggleFlag()">
            <span class="box">${m.cant_tell ? "✕" : ""}</span>
            <span class="t"><b>Couldn't tell from this text</b><span>The abstract failed you, not the grant</span></span>
            <span class="kk">C</span>
          </button>
        </div>
        <div class="foot">
          <div class="hint">Answering saves and moves on · <b>←</b> revisit any record${m.reason ? ` · <span style="color:#14375F">reason saved</span>` : ""}</div>
          <div class="sp"></div>
          <button class="small" onclick="park()">Park <b>S</b></button>
          <button class="small" onclick="openNote()">${m.reason ? "Edit reason" : "Add reason"} <b>R</b></button>
        </div>
      </div></div>
      ${S.asking ? `<div class="note"><div style="max-width:716px;margin:0 auto">
        <div style="display:flex;align-items:baseline;gap:11px;margin-bottom:10px">
          <span style="font-size:14px;font-weight:500">One line on why</span>
          <span style="font-size:13px;color:#70707A">optional · ${esc(S.askWhy)}</span>
        </div>
        <input id="noteinput" value="${esc(S.note)}" placeholder="e.g. targets senescence, but every endpoint is an AD measure">
        <div style="display:flex;align-items:center;gap:18px;margin-top:10px;font-size:12.5px;color:#70707A">
          <button class="small" style="border-color:#14375F;color:#14375F" onclick="closeNote(false)">Save and continue <b>↵</b></button>
          <button class="small" onclick="closeNote(true)">Skip <b>Esc</b></button>
          <div class="sp"></div>
          <span>Reasons are the most useful thing you can leave behind.</span>
        </div>
      </div></div>` : ""}
    </div>
    ${refPanel()}
  </div>`;
  if (S.asking) focusNote();
}

boot();
</script>
</body>
</html>
