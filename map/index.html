<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Longevity Politics Index</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23101623' stroke='%23f2c14e'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%2335b779'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <svg id="map" aria-label="World map of the Longevity Politics Index"></svg>

  <header id="masthead">
    <h1>Longevity Politics Index</h1>
    <p class="tagline" id="tagline"></p>
    <div class="switcher" id="scenario-switch" role="group" aria-label="Label scenario" hidden>
      <button type="button" data-scenario="rules">Rules (v2)</button>
      <button type="button" data-scenario="adjudicated">Adjudicated (AI)</button>
    </div>
    <div class="counters" id="counters" hidden></div>
  </header>

  <div id="legend" hidden></div>
  <div id="tooltip" hidden></div>

  <aside id="panel">
    <div id="panel-body">
      <p class="loading">Loading&hellip;</p>
    </div>
  </aside>

  <p id="load-error" hidden>Could not load the map data. Serve the repository
  root &mdash; <code>python3 -m http.server 8010</code> &mdash; and open
  <code>/map/</code> from there.</p>
</div>
<script src="vendor/d3.v7.9.0.min.js"></script>
<script src="scoring.js"></script>
<script src="app.js"></script>
</body>
</html>
